name: App Distribution

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      bump:
        description: App version bump type.
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      release_notes:
        description: Release notes for Firebase App Distribution.
        type: string
        required: true
        default: Manual release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest=$(git tag --list 'demo-*' --sort=-v:refname | grep -E '^demo-[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          current=${latest#demo-}
          current=${current:-1.0.0}
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          version="$major.$minor.$patch"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

  distribute:
    name: Build & Distribute
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ ! -f "${ANDROID_SDK_ROOT}/licenses/android-sdk-license" ]; then
            yes | sdkmanager --licenses >/dev/null || true
          fi
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; const a=JSON.parse(fs.readFileSync(p)); a.expo.version=process.env.VERSION; a.expo.android.versionCode=Number(process.env.VERSION_CODE); fs.writeFileSync(p, `${JSON.stringify(a, null, 2)}\n`);'
        working-directory: example

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
        working-directory: example

      - name: Configure FreeRASP Android dependencies
        run: bash scripts/android.sh --configure-only example/android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: example/android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        working-directory: example/android

      - name: Build signed release APK
        run: ./gradlew app:assembleRelease --no-daemon --build-cache
        working-directory: example/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_VRTX_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_VRTX_CLIENT_ID }}
          EXPO_PUBLIC_VRTX_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_VRTX_CLIENT_SECRET }}
          EXPO_PUBLIC_VRTX_ENVIRONMENT: SANDBOX
          VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Keep the shipped APK downloadable from the run page (device testing
      # and binary inspection) independent of Firebase App Distribution.
      - name: Upload APK artifact
        id: apk-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-sandbox-react-native-${{ needs.prepare.outputs.version }}
          path: example/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.12.0

      - name: Authenticate to Firebase
        shell: bash
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          test -n "$FIREBASE_KEY"
          key_file=$(mktemp)
          chmod 600 "$key_file"
          printf '%s' "$FIREBASE_KEY" > "$key_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - name: Distribute APK to Firebase
        shell: bash
        env:
          APP_ID: ${{ secrets.SANDBOX_FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes || format('Pull request #{0} test build', github.event.pull_request.number) }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          test -n "$APP_ID" && test -n "$TESTERS"
          notes_file=$(mktemp)
          testers_file=$(mktemp)
          printf '%s' "$RELEASE_NOTES" > "$notes_file"
          printf '%s' "$TESTERS" > "$testers_file"
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "$APP_ID" \
            --release-notes-file "$notes_file" \
            --testers-file "$testers_file"

      # Direct POST instead of the github-action-appetize wrapper so the
      # publicURL can be included in the Slack release announcement.
      - name: Upload preview to Appetize.io
        id: appetize
        shell: bash
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APPETIZE_TOKEN}" ]; then
            echo "::error::APPETIZE_API_TOKEN is not set."
            exit 1
          fi
          response=$(curl -sS --fail-with-body \
            -H "X-API-KEY: ${APPETIZE_TOKEN}" \
            --form "file=@example/android/app/build/outputs/apk/release/app-release.apk" \
            --form "platform=android" \
            "https://api.appetize.io/v1/apps")
          public_url=$(jq -r '.publicURL // empty' <<<"${response}")
          if [ -z "${public_url}" ]; then
            echo "::error::Appetize upload succeeded but no publicURL returned. Response:"
            echo "${response}"
            exit 1
          fi
          echo "url=${public_url}" >> "${GITHUB_OUTPUT}"
          echo "Appetize preview: ${public_url}"

      - name: Tag demo release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "demo-$VERSION"
          git push origin "demo-$VERSION"

      - name: Notify Slack
        shell: bash
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          APPETIZE_URL: ${{ steps.appetize.outputs.url }}
          APK_ARTIFACT_URL: ${{ steps.apk-artifact.outputs.artifact-url }}
          NOTES: ${{ inputs.release_notes || format('Pull request #{0} test build', github.event.pull_request.number) }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; skipping release announcement."
            exit 0
          fi
          tag="demo-${VERSION}"
          title="React Native Demo App ${VERSION} Available (sandbox)"
          tag_url="https://github.com/${REPO}/tree/${tag}"
          context="Environment: sandbox · <${tag_url}|${tag}> · <${APPETIZE_URL}|Appetize preview>"
          if [ -n "${APK_ARTIFACT_URL}" ]; then
            context="${context} · <${APK_ARTIFACT_URL}|APK (expires in 7d)>"
          fi
          payload=$(jq -n \
            --arg title "${title}" \
            --arg notes "${NOTES}" \
            --arg context "${context}" \
            '{
              blocks: [
                {type: "header", text: {type: "plain_text", text: $title}},
                {type: "section", text: {type: "mrkdwn", text: $notes}},
                {type: "context", elements: [{type: "mrkdwn", text: $context}]}
              ]
            }')
          response=$(curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            --data "${payload}" "${WEBHOOK}") || {
            echo "::warning::Slack webhook curl failed: ${response}"
            exit 0
          }
          if [ "${response}" != "ok" ]; then
            echo "::warning::Slack webhook responded: ${response}"
          fi

      - name: Clean up Firebase credentials
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ] && rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
