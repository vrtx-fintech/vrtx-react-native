name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      # Expo regenerates these Gradle files during prebuild. Configure the
      # generated app with the FreeRASP repository and the dependency pins
      # required by its AGP 8.12 toolchain.
      - name: Configure FreeRASP Android dependencies
        run: |
          printf '%s\n' '' 'allprojects {' '  repositories {' "    maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }" '  }' '  configurations.configureEach {' '    resolutionStrategy.force("org.jetbrains.kotlin:kotlin-stdlib:2.1.20")' '    resolutionStrategy.force("org.jetbrains.kotlin:kotlin-reflect:2.1.20")' '    resolutionStrategy.force("androidx.lifecycle:lifecycle-runtime-compose-android:2.10.0")' '    resolutionStrategy.force("androidx.lifecycle:lifecycle-viewmodel-compose-android:2.10.0")' '    resolutionStrategy.eachDependency { if (requested.group == "org.jetbrains.kotlinx" && requested.name.startsWith("kotlinx-serialization-")) { useVersion("1.8.1") } }' '    resolutionStrategy.eachDependency { if (requested.group == "org.jetbrains.kotlinx" && requested.name.startsWith("kotlinx-datetime")) { useVersion("0.7.1") } }' '  }' '}' >> build.gradle
          printf '%s\n' '' 'android {' '  defaultConfig {' '    manifestPlaceholders.vrtxPackageName = applicationId' '    manifestPlaceholders.vrtxCertHash = System.getenv("VRTX_CERT_HASH") ?: ""' '  }' '}' >> app/build.gradle
        working-directory: example/android

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb #v6.3.0

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: example/android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        working-directory: example/android

      - name: Build Android release app
        run: ./gradlew app:assembleRelease --refresh-dependencies
        working-directory: example/android
        env:
          NODE_ENV: production
          VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
