name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      # The Talsec freeRASP artifact is not published to Maven Central. Expo
      # regenerates this Gradle file during prebuild, so add the repository
      # after generation for this CI-only example build.
      - name: Add Talsec freeRASP repository
        run: |
          printf '%s\n' '' 'allprojects {' '  repositories {' "    maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }" '  }' '}' >> build.gradle
        working-directory: example/android

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: example/android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        working-directory: example/android

      - name: Build Android release app
        run: ./gradlew app:assembleRelease --refresh-dependencies
        working-directory: example/android
        env:
          NODE_ENV: production
          VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
