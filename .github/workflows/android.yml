name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@vrtx-fintech"

      - name: Install example dependencies
        run: npm ci
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Kotlin stdlib jdk7/jdk8 resolution
        run: |
          cat >> build.gradle << 'EOF'

          allprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                force 'org.jetbrains.kotlin:kotlin-reflect:2.3.1'
              }
            }
          }
          EOF
        working-directory: example/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Clear Gradle dependency cache
        run: rm -rf ~/.gradle/caches

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: example/android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        working-directory: example/android

      - name: Build Android debug app
        run: ./gradlew app:assembleDebug --no-build-cache
        working-directory: example/android
        env:
          NODE_ENV: production
