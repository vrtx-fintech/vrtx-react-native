name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_VRTX_CLIENT_ID: ${{ vars.PUBLIC_DEMO_CLIENT_ID }}
      EXPO_PUBLIC_VRTX_CLIENT_SECRET: ${{ vars.PUBLIC_DEMO_CLIENT_SECRET }}
      EXPO_PUBLIC_VRTX_ENVIRONMENT: SANDBOX
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install example dependencies
        run: npm ci --ignore-scripts
        working-directory: example

      - name: Generate Android project
        run: npm run prebuild -- --platform android --no-install
        working-directory: example

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 #v6.4.0
        with:
          # Pull requests reuse the cache populated by main; only main writes
          # new cache entries after a successful build.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: example/android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
        working-directory: example/android

      - name: Build Android release app
        run: ./gradlew app:assembleRelease --build-cache
        working-directory: example/android
        env:
          NODE_ENV: production

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
