name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      # ExpoModulesCore (SDK 55) uses Swift 6 closure attribute syntax
      # (e.g. `@MainActor` on closure types) that Xcode 16.4 — the default
      # on macos-latest at time of writing — does not understand. Pin to
      # the latest stable Xcode (26.x family), which matches the maintainer
      # toolchain that the SDK is actually tested against.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build iOS debug app for simulator
        run: |
          xcodebuild \
            -workspace vrtxreactnativeexample.xcworkspace \
            -scheme vrtxreactnativeexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build
        working-directory: example/ios
