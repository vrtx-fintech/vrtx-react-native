name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install example dependencies
        run: npm ci --ignore-scripts
        working-directory: example

      - name: Generate iOS project
        run: npm run prebuild -- --platform ios --no-install
        working-directory: example

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      - name: Build standalone iOS simulator app
        run: bash scripts/ios.sh simulator
        env:
          NODE_ENV: production

      - name: Upload simulator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator
          path: example/ios/build/demo/ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
