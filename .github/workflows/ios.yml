name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # NOTE: we deliberately do NOT use `lfs: true`. On macos-latest
        # runners actions/checkout@v6 was observed to fetch LFS objects
        # to cache but never materialize them in the working tree (and
        # subsequent `git lfs pull` / `git lfs checkout` no-op'd). The
        # framework is also published as a release asset upstream, so
        # downloading it directly is more robust than fighting LFS in
        # CI. The published npm tarball is unaffected — it ships the
        # real binary from the maintainer's machine where LFS works
        # normally.

      - name: Materialize VRTX.xcframework from upstream release
        run: |
          rm -rf VRTX.xcframework
          gh release download 0.0.12 \
            -R vrtx-fintech/vrtx-ios \
            --pattern 'VRTX.xcframework.zip' \
            --clobber
          unzip -q VRTX.xcframework.zip
          rm VRTX.xcframework.zip
          file VRTX.xcframework/ios-arm64/VRTX.framework/VRTX
        working-directory: ios/Frameworks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@vrtx-fintech'

      - name: Install example dependencies
        run: npm ci
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      - name: Build iOS debug app for simulator
        run: |
          xcodebuild \
            -workspace vrtxreactnativeexample.xcworkspace \
            -scheme vrtxreactnativeexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
        working-directory: example/ios
