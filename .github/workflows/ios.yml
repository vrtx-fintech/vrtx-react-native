name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # VRTX.xcframework lives in Git LFS. With .gitattributes in
          # the repo, checkout's smudge filter materializes the binary
          # automatically — no extra `git lfs pull` needed.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@vrtx-fintech'

      - name: Install example dependencies
        run: npm ci
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      # ExpoModulesCore (SDK 55) uses Swift 6 closure attribute syntax
      # (e.g. `@MainActor` on closure types) that Xcode 16.4 — the default
      # on macos-latest at time of writing — does not understand. Pin to
      # the latest stable Xcode (26.x family), which matches the maintainer
      # toolchain that the SDK is actually tested against.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build iOS debug app for simulator
        run: |
          xcodebuild \
            -workspace vrtxreactnativeexample.xcworkspace \
            -scheme vrtxreactnativeexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build
        working-directory: example/ios
