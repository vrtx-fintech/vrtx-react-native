name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # VRTX.xcframework lives in Git LFS; without this the framework
          # is a 133-byte pointer and `pod install` / xcodebuild would fail.
          lfs: true

      # actions/checkout@v6 with `lfs: true` fetches LFS objects to the
      # local cache but on macos-latest leaves the working tree pointing
      # at pointer files. An explicit checkout (and fail-loud verification)
      # is the only way to guarantee CocoaPods reads real plists.
      - name: Materialize LFS files
        run: |
          git lfs install --local
          git lfs fetch --all
          git lfs checkout
          if head -c 50 ios/Frameworks/VRTX.xcframework/Info.plist | grep -q 'lfs.github.com'; then
            echo "::error::VRTX.xcframework/Info.plist is still an LFS pointer after checkout"
            cat ios/Frameworks/VRTX.xcframework/Info.plist
            exit 1
          fi
          file ios/Frameworks/VRTX.xcframework/ios-arm64/VRTX.framework/VRTX

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@vrtx-fintech'

      - name: Install example dependencies
        run: npm ci
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      - name: Build iOS debug app for simulator
        run: |
          xcodebuild \
            -workspace vrtxreactnativeexample.xcworkspace \
            -scheme vrtxreactnativeexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
        working-directory: example/ios
