name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # VRTX.xcframework lives in Git LFS; without this the framework
          # is a 133-byte pointer and `pod install` / xcodebuild would fail.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@vrtx-fintech'

      - name: Install example dependencies
        run: npm ci
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      - name: Build iOS debug app for simulator
        run: |
          xcodebuild \
            -workspace vrtxreactnativeexample.xcworkspace \
            -scheme vrtxreactnativeexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
        working-directory: example/ios
