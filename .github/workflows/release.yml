name: Release

on:
  # Cut a release by publishing a GitHub Release whose tag matches the
  # package.json version, e.g. tag `v0.1.47` when package.json is at 0.1.47.
  release:
    types: [published]
  # Manual escape hatch — useful for re-running a failed publish or for
  # publishing a hotfix tag that was created out-of-band.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.47). Must match package.json version.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `production` environment must exist in repo Settings → Environments
    # with at least one required reviewer. That reviewer's manual approval is
    # the gate that prevents an accidental publish from a tag push.
    environment:
      name: production
      url: https://www.npmjs.com/package/vrtx-react-native
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The vrtx-ios xcframework is stored in Git LFS; without this
          # `pod install` would see 133-byte pointer files and npm publish
          # would ship pointers instead of the real binary.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Releasing $pkg_version"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
