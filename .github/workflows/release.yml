name: Release

on:
  pull_request:
  # Manually publish a new version from the selected branch.
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Semantic version increment'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
    # The `production` environment must exist in repo Settings → Environments
    # with at least one required reviewer. That reviewer's manual approval is
    # the gate that prevents an accidental publish.
    environment:
      name: production
      url: https://www.npmjs.com/package/vrtx-react-native
    permissions:
      contents: write # required to commit and tag manual releases
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          # The vrtx-ios xcframework is stored in Git LFS; without this
          # `pod install` would see 133-byte pointer files and npm publish
          # would ship pointers instead of the real binary.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Bump package version
        run: |
          npm version "${{ inputs.release_type || 'patch' }}" --no-git-tag-version

      - name: Install dependencies and update lockfile
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Commit and tag release
        run: |
          version="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release $version [skip ci]"
          git tag "$version"
          git push origin "HEAD:${RELEASE_BRANCH}"
          git push origin "$version"
