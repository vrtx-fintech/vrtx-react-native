name: Release

on:
  # Manually publish a new version from main.
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Semantic version increment'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create tags and GitHub releases
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # The vrtx-ios xcframework is stored in Git LFS; without this
          # `pod install` would see 133-byte pointer files and npm publish
          # would ship pointers instead of the real binary.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Bump package version
        id: version
        run: |
          package="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package" version 2>/dev/null || true)"
          latest_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"

          if [ -n "$published_version" ] &&
            [ "$published_version" != "$package_version" ] &&
            ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$published_version" >/dev/null 2>&1; then
            next_version="$published_version"
          else
            base_version="$(
              printf '%s\n' "$package_version" "$published_version" "${latest_release#v}" |
                sed '/^$/d' |
                sort -V |
                tail -n 1
            )"
            npm version "$base_version" --no-git-tag-version --allow-same-version
            npm version "${{ inputs.release_type || 'patch' }}" --no-git-tag-version
            next_version="$(node -p "require('./package.json').version")"
          fi

          npm version "$next_version" --no-git-tag-version --allow-same-version
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies and update lockfile
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published; skipping npm publish."
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Create GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target main \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
