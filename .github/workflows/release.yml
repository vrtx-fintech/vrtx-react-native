name: Release

on:
  # Manually publish a new version from main.
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Semantic version increment'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create tags and GitHub releases
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Bump package version
        id: version
        run: |
          package="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package" version 2>/dev/null || true)"
          latest_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"

          if [ -n "$published_version" ] &&
            [ "$published_version" != "$package_version" ] &&
            ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$published_version" >/dev/null 2>&1; then
            next_version="$published_version"
          else
            base_version="$(
              printf '%s\n' "$package_version" "$published_version" "${latest_release#v}" |
                sed '/^$/d' |
                sort -V |
                tail -n 1
            )"
            npm version "$base_version" --no-git-tag-version --allow-same-version
            npm version "${{ inputs.release_type || 'patch' }}" --no-git-tag-version
            next_version="$(node -p "require('./package.json').version")"
          fi

          npm version "$next_version" --no-git-tag-version --allow-same-version
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies and update lockfile
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published; skipping npm publish."
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Create GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target main \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Announce the release in Slack, matching the iOS/Android SDK release
      # workflows. Failures are downgraded to warnings so a Slack outage or a
      # missing webhook never fails an otherwise successful publish.
      - name: Notify Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; skipping release announcement."
            exit 0
          fi
          VERSION="${TAG#v}"
          TITLE="React Native SDK ${VERSION} Available"
          # Reuse the auto-generated GitHub release notes as the announcement
          # body, so notes exist in exactly one place.
          NOTES="$(gh release view "${TAG}" --json body --jq .body || true)"
          if [ -z "${NOTES}" ]; then
            NOTES="See the GitHub release for details."
          fi
          # Slack section blocks reject text over 3000 characters.
          NOTES="${NOTES:0:2900}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          NPM_URL="https://www.npmjs.com/package/vrtx-react-native/v/${VERSION}"
          CONTEXT="<${RELEASE_URL}|GitHub release ${TAG}> · <${NPM_URL}|npm ${VERSION}>"
          PAYLOAD=$(jq -n \
            --arg title "${TITLE}" \
            --arg notes "${NOTES}" \
            --arg context "${CONTEXT}" \
            '{
              blocks: [
                {type: "header", text: {type: "plain_text", text: $title}},
                {type: "section", text: {type: "mrkdwn", text: $notes}},
                {type: "context", elements: [{type: "mrkdwn", text: $context}]}
              ]
            }')
          response=$(curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" "${WEBHOOK}") || {
            echo "::warning::Slack webhook curl failed: ${response}"
            exit 0
          }
          if [ "${response}" != "ok" ]; then
            echo "::warning::Slack webhook responded: ${response}"
          fi
