name: Release

on:
  # Cut a release by publishing a GitHub Release whose tag matches the
  # package.json version, e.g. tag `v0.1.47` when package.json is at 0.1.47.
  release:
    types: [published]
  # Manual escape hatch — useful for re-running a failed publish or for
  # publishing a hotfix tag that was created out-of-band.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.47). Must match package.json version.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `production` environment must exist in repo Settings → Environments
    # with at least one required reviewer. That reviewer's manual approval is
    # the gate that prevents an accidental publish from a tag push.
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/packages
    permissions:
      contents: read
      packages: write # required to push to npm.pkg.github.com
      id-token: write # reserved for npm provenance once we move to npmjs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The vrtx-ios xcframework is stored in Git LFS; without this
          # `pod install` would see 133-byte pointer files and npm publish
          # would ship pointers instead of the real binary.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@vrtx-fintech'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag matches package.json version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Releasing $pkg_version"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
