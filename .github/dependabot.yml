version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /example
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      same-dependency:
        patterns:
          - "*"
        group-by: dependency-name
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
