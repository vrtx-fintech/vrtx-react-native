version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: 'chore'
      include: 'scope'
    schedule:
      interval: weekly
    # Expo SDK 57 supports React Native 0.86 and React 19.2. Keep newer
    # runtime lines for a separately validated stable Expo SDK migration.
    # https://docs.expo.dev/versions/latest/
    ignore:
      - dependency-name: react-native
        versions: ['>=0.87.0']
      - dependency-name: react
        versions: ['>=19.3.0']
      - dependency-name: '@types/react'
        versions: ['>=19.3.0']
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /example
    commit-message:
      prefix: 'demo'
      include: 'scope'
    schedule:
      interval: weekly
    # Expo SDK 57 supports React Native 0.86 and React 19.2. Keep newer
    # runtime lines for a separately validated stable Expo SDK migration.
    # https://docs.expo.dev/versions/latest/
    ignore:
      - dependency-name: react-native
        versions: ['>=0.87.0']
      - dependency-name: react
        versions: ['>=19.3.0']
      - dependency-name: '@types/react'
        versions: ['>=19.3.0']
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    commit-message:
      prefix: 'chore'
      include: 'scope'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 'ci'
      include: 'scope'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
