version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: 'deps(sdk)'
    schedule:
      interval: weekly
    groups:
      root-dev-deps:
        dependency-type: development

  - package-ecosystem: npm
    directory: /example
    commit-message:
      prefix: 'deps(example)'
    schedule:
      interval: weekly
    groups:
      example-deps:
        dependency-type: production
      example-dev-deps:
        dependency-type: development

  - package-ecosystem: gradle
    directory: /android
    commit-message:
      prefix: 'chore'
      include: 'scope'
    schedule:
      interval: weekly
    groups:
      android-deps:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 'ci'
      include: 'scope'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
