plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

repositories {
    maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }
    maven { url 'https://jitpack.io' }
    mavenCentral()
}

group = 'sa.vrtx.reactnative'
version = '0.1.0'

dependencies {
    // vrtx-android 0.1.1 currently brings in Lifecycle 2.11, which requires
    // Android Gradle Plugin 9.1. Keep the transitive graph compatible with
    // Expo SDK 57 / AGP 8.12 used by React Native consumers.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:2.1.20') {
            version { strictly '2.1.20' }
        }
        implementation('androidx.lifecycle:lifecycle-runtime-compose-android:2.10.0') {
            version { strictly '2.10.0' }
        }
        implementation('androidx.lifecycle:lifecycle-viewmodel-compose-android:2.10.0') {
            version { strictly '2.10.0' }
        }
    }

    implementation 'sa.vrtx.sa:vrtx-android:0.1.1'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'com.facebook.react:react-android'
}

android {
  namespace "sa.vrtx.reactnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdk 29
    compileSdk 37
    targetSdk 36
  }
  
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  
  kotlinOptions {
    jvmTarget = '17'
  }
  
  lintOptions {
    abortOnError false
  }
}
