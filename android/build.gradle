plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

repositories {
    maven { url 'https://europe-west3-maven.pkg.dev/talsec-artifact-repository/freerasp' }
    maven { url 'https://jitpack.io' }
    mavenCentral()
}

group = 'sa.vrtx.reactnative'
version = '0.1.0'

// Keep the native SDK's newer Kotlin dependencies compatible with Expo SDK 57's
// Kotlin 2.1 / AGP 8.12 toolchain. This is local resolution only, not an
// exported strict constraint on the host application's dependency graph.
configurations.configureEach {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
    force 'org.jetbrains.kotlin:kotlin-reflect:2.1.20'
    force 'androidx.lifecycle:lifecycle-runtime-compose-android:2.10.0'
    force 'androidx.lifecycle:lifecycle-viewmodel-compose-android:2.10.0'
    eachDependency {
      if (requested.group == 'org.jetbrains.kotlinx' && requested.name.startsWith('kotlinx-serialization-')) {
        useVersion '1.8.1'
      }
      if (requested.group == 'org.jetbrains.kotlinx' && requested.name.startsWith('kotlinx-datetime')) {
        useVersion '0.7.1'
      }
    }
  }
}

dependencies {
    implementation 'sa.vrtx.sa:vrtx-android:0.1.6'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'com.facebook.react:react-android'
}

android {
  namespace "sa.vrtx.reactnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdk 29
    compileSdk 37
    targetSdk 36
  }
  
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  
  kotlinOptions {
    jvmTarget = '17'
  }
  
  lintOptions {
    abortOnError false
  }
}
