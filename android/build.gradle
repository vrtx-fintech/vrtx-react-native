plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

repositories {
    mavenCentral()
}

group = 'sa.vrtx.reactnative'
version = '0.1.0'

dependencies {
    constraints {
        implementation('com.google.code.gson:gson:2.14.0') {
            because 'CVE-2022-25647 in older Gson versions pulled transitively by the Android dependency graph'
        }
        implementation('commons-io:commons-io:2.22.0') {
            because 'CVE-2021-29425 in older Commons IO versions pulled transitively by the Android dependency graph'
        }
    }

    implementation 'sa.vrtx.sa:vrtx-android:0.0.12'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'com.facebook.react:react-android'
}

android {
  namespace "sa.vrtx.reactnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdk 29
    compileSdk 36
    targetSdk 36
  }
  
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  
  kotlinOptions {
    jvmTarget = '17'
  }
  
  lintOptions {
    abortOnError false
  }
}
